<!-- Contenedor global de alertas (toasts) -->
<div class="alertas-stack" role="status" aria-live="polite">
  @for (alerta of (alertas.alertas$ | async); track alerta.id) {
    <div class="alerta" [attr.data-tipo]="alerta.tipo">
      <span class="alerta-icono" aria-hidden="true">
        @switch (alerta.tipo) {
          @case ('exito') {
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          }
          @case ('error') {
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <line x1="12" y1="8" x2="12" y2="13"/>
              <line x1="12" y1="16.5" x2="12.01" y2="16.5"/>
            </svg>
          }
          @default {
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <line x1="12" y1="11" x2="12" y2="16"/>
              <line x1="12" y1="7.5" x2="12.01" y2="7.5"/>
            </svg>
          }
        }
      </span>
      <div class="alerta-cuerpo">
        <p class="alerta-titulo">{{ alerta.titulo }}</p>
        @if (alerta.detalle) {
          <p class="alerta-detalle">{{ alerta.detalle }}</p>
        }
      </div>
      <button type="button" class="alerta-cerrar" aria-label="Cerrar alerta" (click)="alertas.cerrar(alerta.id)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }
</div>
